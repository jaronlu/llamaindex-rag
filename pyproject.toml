[project]
name = "llamaindex-rag"
version = "0.1.0"
description = "基于 LlamaIndex 的可追溯 PDF 知识库与 RAG 学习项目"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "jaronlu" }]
requires-python = ">=3.12"
dependencies = [
    "llama-index-core>=0.14.25",
    "llama-index-embeddings-huggingface>=0.6,<0.7",
    "llama-index-llms-openai-like>=0.8.1",
    "llama-index-readers-file>=0.7.0",
    "fastapi>=0.115",
    "pypdf>=6.21.3",
    "sentence-transformers>=5.0",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
]

[project.urls]
Repository = "https://github.com/jaronlu/llamaindex-rag"
